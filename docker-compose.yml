# docker-compose.yml
services:
  postgres:
    image: postgres:17-alpine
    container_name: linkforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # auto-runs any *.sql / *.sh on FIRST boot (empty data dir):
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app_user -d linkforge" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  app:
    build: .
    container_name: linkforge-app
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    environment:
       APP_ENV: ${CONTAINER_APP_ENV:-production}
       # Service name, not localhost: inside the container, localhost is the app itself.
       DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
       ANALYTICS_IP_SALT: ${ANALYTICS_IP_SALT}
       RUST_LOG: ${RUST_LOG:-linkforge=info,tower_http=warn,sqlx=warn}
       # All host traffic reaches the container from one bridge IP, so it shares
       # one rate-limit bucket. Tests raise this; the default stays realistic.
       LINKFORGE__RATE_LIMIT__REQUESTS: ${LINKFORGE__RATE_LIMIT__REQUESTS:-100}
       LINKFORGE__RATE_LIMIT__WINDOW_SECS: ${LINKFORGE__RATE_LIMIT__WINDOW_SECS:-60}
       LINKFORGE__ANALYTICS__CLICK_MODE: ${LINKFORGE__ANALYTICS__CLICK_MODE:-async}
    stop_signal: SIGTERM
    stop_grace_period: 30s

volumes:
  pgdata:
  redisdata:
