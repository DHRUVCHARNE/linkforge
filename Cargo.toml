[package]
name = "linkforge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = {version="0.8.9"}
dashmap = "6.2.1"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = {version="1.0.151"}
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
chrono={version="0.4",features=["serde"]}
async-trait="0.1"
thiserror = "2.0.20"
uuid = {version="1.26.1",features=["v4"]}

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
criterion="0.5"

[[bench]]
name="redirect_bench"
harness=false
